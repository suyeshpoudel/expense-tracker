{% extends "base.html" %}

{% block title %}Bad request · Expense Tracker{% endblock %}

{% block content %}
<div class="error-shell">
    <div class="error-card">
        <span class="error-code">400</span>
        <h1 class="error-title">Bad request</h1>
        <p class="error-text">The request could not be understood. Check the address and try again.</p>
        <div class="error-actions">
            <a class="button button--primary" href="{% url 'core:home' %}">Go to home</a>
        </div>
    </div>
</div>
{% endblock %}
