{% extends "base.html" %}

{% block title %}Permission denied · Expense Tracker{% endblock %}

{% block content %}
<div class="text-center py-5">
    <p class="display-5 fw-semibold mb-2">403</p>
    <h1 class="h3 mb-2">Permission denied</h1>
    <p class="app-muted mb-4">You do not have permission to access this page.</p>
    {% if user.is_authenticated %}
        <a class="btn btn-success" href="{% url 'core:dashboard' %}">Go to dashboard</a>
    {% else %}
        <a class="btn btn-success" href="{% url 'accounts:login' %}">Log in</a>
    {% endif %}
</div>
{% endblock %}
