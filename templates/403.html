{% extends "base.html" %}

{% block title %}Permission denied · Expense Tracker{% endblock %}

{% block content %}
<div class="error-shell">
    <div class="error-card">
        <span class="error-code">403</span>
        <h1 class="error-title">Permission denied</h1>
        <p class="error-text">You do not have access to this page. If you think this is a mistake, sign in with the right account.</p>
        <div class="error-actions">
            <a class="button button--primary" href="{% url 'core:home' %}">Go to home</a>
            <a class="button button--secondary" href="{% url 'accounts:login' %}">Log in</a>
        </div>
    </div>
</div>
{% endblock %}
