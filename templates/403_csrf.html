{% extends "base.html" %}

{% block title %}Security check failed · Expense Tracker{% endblock %}

{% block content %}
<div class="error-shell">
    <div class="error-card">
        <span class="error-code">403</span>
        <h1 class="error-title">Security check failed</h1>
        <p class="error-text">This form could not be verified. Refresh the page and try again.</p>
        <div class="error-actions">
            <a class="button button--primary" href="{% url 'core:home' %}">Go to home</a>
        </div>
    </div>
</div>
{% endblock %}
