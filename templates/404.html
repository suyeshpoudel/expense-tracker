{% extends "base.html" %}

{% block title %}Page not found · Expense Tracker{% endblock %}

{% block content %}
<div class="error-shell">
    <div class="error-card">
        <span class="error-code">404</span>
        <h1 class="error-title">Page not found</h1>
        <p class="error-text">The page you are looking for may have moved, or the address may be wrong.</p>
        <div class="error-actions">
            <a class="button button--primary" href="{% url 'core:home' %}">Go to home</a>
        </div>
    </div>
</div>
{% endblock %}
