{% extends "base.html" %}

{% block title %}Something went wrong · Expense Tracker{% endblock %}

{% block content %}
<div class="error-shell">
    <div class="error-card">
        <span class="error-code">500</span>
        <h1 class="error-title">Something went wrong</h1>
        <p class="error-text">An unexpected error occurred. Please try again in a moment.</p>
        <div class="error-actions">
            <a class="button button--primary" href="{% url 'core:home' %}">Go to home</a>
        </div>
    </div>
</div>
{% endblock %}
